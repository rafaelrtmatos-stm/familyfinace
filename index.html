<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>Familyfinance | Gestão Premium</title>
    <!-- Tipografia e Bibliotecas -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    
    <style>
        :root {
            --slate-900: #0f172a;
            --primary: #3d2db5;
            --bg-app: #f8fafc;
            --radius-premium: 1.5rem;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
        body { font-family: 'Inter', sans-serif; background-color: var(--slate-900); color: #1e293b; display: flex; align-items: center; justify-content: center; min-height: 100vh; }

        /* ── PHONE SHELL (16:9 Perspective) ── */
        .phone {
            width: 390px; height: 844px;
            position: relative; overflow: hidden;
            background: var(--bg-app);
            box-shadow: 0 40px 100px rgba(0,0,0,.5), 0 0 0 12px #111;
            border-radius: 46px;
        }

        @media(max-width: 420px) {
            .phone { width: 100%; height: 100%; border-radius: 0; box-shadow: none; }
            body { background: var(--bg-app); }
        }

        .screen { position: absolute; inset: 0; display: flex; flex-direction: column; overflow: hidden; background: var(--bg-app); transition: transform .3s cubic-bezier(.4,0,.2,1), opacity .3s ease; }
        .screen.off { transform: translateX(100%); opacity: 0; pointer-events: none; }
        .hidden { display: none !important; }

        /* ── LOGIN SPECIFIC ── */
        .login-card { background: white; border-radius: var(--radius-premium); padding: 2rem; width: 90%; max-width: 320px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); }
        .logo-container { background: var(--slate-900); padding: 1.5rem; border-radius: 2rem; margin-bottom: 1.5rem; display: inline-block; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); }
        
        .photo-selector {
            width: 80px; height: 80px; border-radius: 50%; border: 2px dashed #cbd5e1;
            margin: 0 auto 1rem; display: flex; align-items: center; justify-content: center;
            cursor: pointer; overflow: hidden; background: #f1f5f9; transition: all 0.2s;
        }
        .photo-selector:hover { border-color: var(--primary); background: #e2e8f0; }
        .photo-preview { width: 100%; height: 100%; object-cover: cover; }

        .input-premium {
            width: 100%; padding: 0.75rem 1rem; border-radius: 0.75rem; border: 1px solid #e2e8f0;
            outline: none; transition: all 0.2s; font-size: 0.9rem;
        }
        .input-premium:focus { border-color: var(--primary); ring: 2px solid rgba(61, 45, 181, 0.1); }

        .btn-entrar {
            width: 100%; padding: 0.85rem; background: var(--primary); color: white;
            border-radius: 0.75rem; font-weight: 700; transition: transform 0.1s;
        }
        .btn-entrar:active { transform: scale(0.98); }

        /* ── INTERFACE HEADER ── */
        .gh { background: linear-gradient(160deg, #1e293b 0%, #334155 100%); padding: 1rem 1.5rem 2rem; color: white; }
        
        /* ── TOAST ── */
        .toast-el { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); background: var(--slate-900); color: white; padding: 0.75rem 1.5rem; border-radius: 100px; font-weight: 600; z-index: 1000; display: none; }
    </style>
</head>
<body>

<div class="phone">
    
    <!-- ══ LOGIN SCREEN ══ -->
    <div class="screen flex flex-col items-center justify-center p-6" id="loginScreen" style="background: linear-gradient(180deg, #f8fafc 0%, #e2e8f0 100%);">
        
        <!-- Logo em Container Escuro -->
        <div class="text-center">
            <div class="logo-container">
                <img src="icon.png" alt="Familyfinance" class="w-16 h-16 object-contain">
            </div>
            <h1 class="text-2xl font-black text-slate-900 tracking-tighter">Familyfinance</h1>
            <p class="text-slate-400 text-xs font-bold uppercase tracking-widest mb-8">Santarém · Pará</p>
        </div>

        <!-- Card de Login -->
        <div class="login-card">
            <div class="text-center">
                <label for="avatar-input" class="photo-selector" id="photo-label">
                    <span id="plus-icon" class="text-slate-400 text-2xl font-light">+</span>
                    <img id="avatar-preview" class="photo-preview hidden" src="#" alt="Preview">
                </label>
                <input type="file" id="avatar-input" class="hidden" accept="image/*">
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-6">Sua Foto</p>
            </div>

            <form id="login-form" class="space-y-4">
                <input type="email" id="loginEmail" placeholder="E-mail" class="input-premium" required>
                <input type="password" id="loginPass" placeholder="Senha" class="input-premium" required>
                
                <div id="loginErr" class="text-red-500 text-[10px] font-bold text-center h-4"></div>
                
                <button type="button" onclick="doLoginBtn()" class="btn-entrar shadow-lg shadow-indigo-200">Entrar →</button>
                
                <div class="text-center pt-2">
                    <button type="button" onclick="recoverPass()" class="text-[10px] font-bold text-slate-400 hover:text-slate-600 uppercase tracking-tighter">Esqueci minha senha</button>
                </div>
            </form>
        </div>

        <!-- Suporte Técnico -->
        <div class="fixed bottom-8 right-10 text-right">
            <p class="text-[8px] font-bold text-slate-400 uppercase tracking-[0.2em] mb-1">Suporte Técnico</p>
            <a href="mailto:rafaelrtmatos@gmail.com" class="text-[10px] font-black text-slate-600 hover:text-indigo-600 transition-colors">RAFAEL TAVARES</a>
        </div>
    </div>

    <!-- ══ HOME SCREEN ══ -->
    <div class="screen off" id="sc-home">
        <div class="gh">
            <div class="flex justify-between items-center mb-6">
                <button onclick="logout()" class="text-slate-400"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg></button>
                <span class="text-xs font-black tracking-widest opacity-80 uppercase">Dashboard</span>
                <div class="w-8 h-8 rounded-full bg-indigo-500 flex items-center justify-center font-bold text-xs" id="userInitial">R</div>
            </div>
            
            <div class="text-center mb-6">
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-[0.3em] mb-1">Saldo Pendente</p>
                <h2 class="text-4xl font-black tracking-tighter" id="homeTotal">R$ 0,00</h2>
            </div>
            
            <div class="grid grid-cols-3 gap-2">
                <div class="bg-white/5 p-3 rounded-2xl text-center">
                    <p class="text-[8px] font-bold text-slate-400 uppercase mb-1">Caixa</p>
                    <p class="text-sm font-bold text-emerald-400" id="homeCaixaVal">R$ 0,00</p>
                </div>
                <div class="bg-white/5 p-3 rounded-2xl text-center">
                    <p class="text-[8px] font-bold text-slate-400 uppercase mb-1">Total Mês</p>
                    <p class="text-sm font-bold" id="homeTotalMes">R$ 0,00</p>
                </div>
                <div class="bg-white/5 p-3 rounded-2xl text-center">
                    <p class="text-[8px] font-bold text-slate-400 uppercase mb-1">Diária</p>
                    <p class="text-sm font-bold text-orange-400" id="homeDiariaVal">R$ 0,00</p>
                </div>
            </div>
        </div>
        
        <div class="flex-1 overflow-y-auto p-4 space-y-4" id="homeContent">
            <!-- Widgets dinâmicos via JS -->
            <div id="homeWidgets"></div>
            <div id="catList" class="space-y-2"></div>
        </div>

        <!-- Nav Inferior Premium -->
        <div class="bg-white border-t border-slate-100 p-4 flex justify-around items-center">
            <button class="text-indigo-600"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></button>
            <button onclick="go('sc-add')" class="bg-slate-900 text-white w-12 h-12 rounded-2xl flex items-center justify-center shadow-lg shadow-slate-300"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
            <button class="text-slate-300"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg></button>
        </div>
    </div>

    <!-- ══ ADD SCREEN ══ (Versão Simplificada para o Script) -->
    <div class="screen off" id="sc-add">
        <div class="p-6">
            <div class="flex justify-between items-center mb-8">
                <button onclick="back()" class="text-slate-900 font-bold">← Voltar</button>
                <h3 class="font-black uppercase tracking-widest text-xs">Nova Transação</h3>
                <div class="w-8"></div>
            </div>
            <p class="text-center text-slate-400 text-xs font-bold mb-8">Utilize o painel para adicionar contas recorrentes ou avulsas.</p>
            <button onclick="back()" class="w-full py-4 bg-slate-900 text-white rounded-2xl font-bold">Fechar</button>
        </div>
    </div>

</div>

<div class="toast-el" id="toastEl"></div>

<script>
/* ════ CONFIGURAÇÃO SUPABASE ════ */
const SUPA_URL = 'https://mvojhrkuuveiozbgigny.supabase.co';
const SUPA_KEY = 'sb_publishable_QYn7gHfDWOHlogX--h6ImQ_6FYqDbm7';
const supabase = window.supabase.createClient(SUPA_URL, SUPA_KEY);

let curUser = null;
let db = { bills: [], users: [], cats: [] };

/* ════ LÓGICA DE LOGIN ════ */
async function doLoginBtn() {
    const email = document.getElementById('loginEmail').value;
    const password = document.getElementById('loginPass').value;
    const errEl = document.getElementById('loginErr');

    showToast("Autenticando...");
    
    const { data, error } = await supabase.auth.signInWithPassword({ email, password });

    if (error) {
        errEl.textContent = "E-mail ou senha inválidos.";
        return;
    }

    // Sucesso
    curUser = data.user;
    document.getElementById('userInitial').textContent = email.charAt(0).toUpperCase();
    go('sc-home');
    loadAppData();
}

async function recoverPass() {
    const email = document.getElementById('loginEmail').value;
    if(!email) { showToast("Digite seu e-mail acima."); return; }
    
    const { error } = await supabase.auth.resetPasswordForEmail(email);
    showToast(error ? "Erro ao enviar." : "Link enviado ao e-mail!");
}

/* ════ PRÉVIA DA FOTO ════ */
document.getElementById('avatar-input').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = function(event) {
            document.getElementById('avatar-preview').src = event.target.result;
            document.getElementById('avatar-preview').classList.remove('hidden');
            document.getElementById('plus-icon').classList.add('hidden');
        }
        reader.readAsDataURL(file);
    }
});

/* ════ NAVEGAÇÃO ════ */
function go(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.add('off'));
    document.getElementById(id).classList.remove('off');
}

function back() { go('sc-home'); }

function logout() {
    supabase.auth.signOut();
    location.reload();
}

/* ════ CARREGAMENTO DE DADOS (SIMPLIFICADO) ════ */
async function loadAppData() {
    // Aqui entra sua lógica anterior de carregar bills do Supabase
    showToast("Sincronizando Familyfinance...");
    // Simulação de renderização para Rafael
    document.getElementById('homeTotal').textContent = "R$ 1.450,00";
    document.getElementById('homeCaixaVal').textContent = "R$ 2.000,00";
}

function showToast(msg) {
    const t = document.getElementById('toastEl');
    t.textContent = msg;
    t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 3000);
}

window.onload = async () => {
    const { data: { session } } = await supabase.auth.getSession();
    if (session) {
        curUser = session.user;
        document.getElementById('userInitial').textContent = curUser.email.charAt(0).toUpperCase();
        go('sc-home');
        loadAppData();
    }
};
</script>
</body>
</html>
